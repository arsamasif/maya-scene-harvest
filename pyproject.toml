[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-harvest"
version = "0.1.0"
description = "Batch extraction of Maya and USD scene data into Parquet datasets for analysis and ML."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arsam Ali" }]
requires-python = ">=3.9"
dependencies = ["pyarrow>=12", "pandas>=2"]

[project.optional-dependencies]
usd = ["usd-core>=23.11"]
charts = ["matplotlib>=3.7"]
ui = ["PySide6>=6.5", "matplotlib>=3.7"]
test = ["pytest>=7", "usd-core>=23.11", "matplotlib>=3.7"]

[project.scripts]
scene-harvest = "scene_harvest.cli:main"

[project.gui-scripts]
scene-harvest-ui = "scene_harvest.ui:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/scene_harvest/test"]
